<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  font-family:'Tajawal',sans-serif;
  width:100vw;height:100vh;overflow:hidden;direction:rtl;
  background:#f7f5f0;
  color:#2c2c2c;
}

/* ===== الخلفية المزخرفة ===== */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  opacity:0.03;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L55 30L30 55L5 30Z' fill='none' stroke='%23476831' stroke-width='0.5'/%3E%3C/svg%3E");
}

.page{position:relative;z-index:1;display:flex;flex-direction:column;width:100vw;height:100vh}

/* ===== الشريط العلوي ===== */
.topbar{
  height:6vh;flex-shrink:0;
  background:linear-gradient(135deg,#476831 0%,#5a8140 40%,#476831 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 3vw;
  box-shadow:0 4px 20px rgba(71,104,49,0.3);
}
.topbar .brand{display:flex;align-items:center;gap:1.2vw}
.topbar .logo-img{
  height:4vh;
  filter:brightness(10);
}
.topbar h1{font-size:2.4vh;font-weight:800;color:#fff;letter-spacing:0.5px}
.topbar .sep{color:rgba(255,255,255,0.3);font-weight:300;margin:0 0.5vw}
.topbar .sub{font-size:1.8vh;font-weight:400;color:#c8e0b4}
.topbar .meta{display:flex;align-items:center;gap:2vw}
.topbar .clock{font-size:2.8vh;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:1px}
.topbar .upd{font-size:1.3vh;color:#a8cc8c;font-weight:500}

/* ===== القسم الرئيسي ===== */
.content{flex:1;display:flex;flex-direction:column;padding:1.5vh 2.5vw 1.5vh;gap:1.5vh;min-height:0}

/* ===== البطل — الرقم الإجمالي ===== */
.hero{
  display:flex;align-items:center;justify-content:center;gap:5vw;
  background:linear-gradient(135deg,#fff 0%,#f0ede5 100%);
  border-radius:2vh;
  padding:2vh 4vw;
  border:1px solid #e0ddd5;
  box-shadow:0 4px 24px rgba(0,0,0,0.04);
  flex-shrink:0;
  height:22vh;
}
.hero-left{text-align:center}
.hero-total{
  font-size:12vh;font-weight:900;line-height:0.9;
  color:#476831;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(71,104,49,0.1);
}
.hero-label{
  font-size:2.2vh;font-weight:700;color:#8b9e6b;
  letter-spacing:3px;margin-top:0.5vh;
}

/* حلقة الجنس في البطل */
.hero-ring{position:relative;width:14vh;height:14vh}
.hero-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero-ring .bg{fill:none;stroke:#e8e5dd;stroke-width:8}
.hero-ring .arc-m{fill:none;stroke:#476831;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray 1.5s ease}
.hero-ring .arc-f{fill:none;stroke:#9B6FB1;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray 1.5s ease}
.ring-info{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-info .ri-v{font-size:2.4vh;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3}
.ring-info .ri-l{font-size:1.2vh;font-weight:600;color:#aaa}
.ri-m{color:#476831}
.ri-f{color:#9B6FB1}

.hero-legend{display:flex;flex-direction:column;gap:1vh}
.hl-item{display:flex;align-items:center;gap:0.8vw}
.hl-dot{width:1.5vh;height:1.5vh;border-radius:50%}
.hl-dot.m{background:#476831}
.hl-dot.f{background:#9B6FB1}
.hl-num{font-size:3vh;font-weight:900;font-variant-numeric:tabular-nums}
.hl-num.m{color:#476831}
.hl-num.f{color:#9B6FB1}
.hl-lbl{font-size:1.6vh;color:#999;font-weight:600;margin-right:0.3vw}

/* ===== صف البطاقات ===== */
.row{display:flex;gap:1vw;flex:1;min-height:0}

.card{
  flex:1;
  background:#fff;
  border-radius:1.8vh;
  border:1px solid #e8e5dd;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 2px 16px rgba(0,0,0,0.03);
  transition:transform 0.3s ease,box-shadow 0.3s ease;
  padding:1vh 0.5vw;
}

/* شريط علوي ملون سميك */
.card::before{
  content:'';position:absolute;top:0;right:0;left:0;
  height:5px;border-radius:2vh 2vh 0 0;
}
.card-green::before{background:linear-gradient(90deg,#476831,#6b8f4e)}
.card-purple::before{background:linear-gradient(90deg,#7B5B9B,#9B6FB1)}
.card-navy::before{background:linear-gradient(90deg,#232E64,#3a4a8c)}
.card-gold::before{background:linear-gradient(90deg,#B08D3A,#d4a843)}

.card-title{
  font-size:2.2vh;font-weight:800;
  color:#555;margin-bottom:0.3vh;
  white-space:nowrap;
}

.card-num{
  font-size:6vh;font-weight:900;line-height:1;
  color:#2c2c2c;
  font-variant-numeric:tabular-nums;
  margin-bottom:0.8vh;
}

/* شريط نسبة ذكور/إناث */
.bar-wrap{width:80%;height:1.2vh;border-radius:1vh;background:#eee;overflow:hidden;display:flex;margin-bottom:0.6vh}
.bar-m{background:linear-gradient(90deg,#476831,#6b8f4e);height:100%;transition:width 1.5s ease;border-radius:0 1vh 1vh 0}
.bar-f{background:linear-gradient(90deg,#9B6FB1,#7B5B9B);height:100%;transition:width 1.5s ease;border-radius:1vh 0 0 1vh}

.card-mf{display:flex;justify-content:center;gap:2.5vw}
.mf-col{text-align:center}
.mf-num{font-size:2.8vh;font-weight:900;font-variant-numeric:tabular-nums}
.mf-num.m{color:#476831}
.mf-num.f{color:#9B6FB1}
.mf-lbl{font-size:1.3vh;color:#bbb;font-weight:700;margin-top:0.1vh}

/* === التحميل === */
#loadingOverlay{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(135deg,#f7f5f0,#ece9e0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ld-ring{
  width:60px;height:60px;
  border:4px solid #e0ddd5;border-top-color:#476831;
  border-radius:50%;animation:sp 0.8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.ld-txt{margin-top:16px;color:#8b9e6b;font-size:2vh;font-weight:700}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="ld-ring"></div><div class="ld-txt">جاري تحميل البيانات...</div></div>

<div class="page" id="mainContent" style="display:none">
  <!-- الشريط العلوي -->
  <div class="topbar">
    <div class="brand">
      <img class="logo-img" src="https://image2url.com/r2/default/images/1775443354621-9813e5f5-b4a7-4d23-8a0c-131fbfe58ec7.png" alt="إكرام الضيف" onerror="this.style.display='none'">
      <h1>إحصائيات الحجاج</h1>
      <span class="sep">|</span>
      <span class="sub">إكرام الضيف</span>
    </div>
    <div class="meta">
      <span class="upd" id="upd"></span>
      <span class="clock" id="clk"></span>
    </div>
  </div>

  <div class="content">
    <!-- البطل -->
    <div class="hero">
      <div class="hero-left">
        <div class="hero-total" id="hTotal">0</div>
        <div class="hero-label">إجمالي الحجاج</div>
      </div>
      <div class="hero-ring">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="40"/>
          <circle class="arc-m" id="arcM" cx="50" cy="50" r="40" stroke-dasharray="0 251.3"/>
          <circle class="arc-f" id="arcF" cx="50" cy="50" r="40" stroke-dasharray="0 251.3"/>
        </svg>
        <div class="ring-info">
          <span class="ri-v ri-m" id="riM">0</span>
          <span class="ri-l">ذكور</span>
          <span class="ri-v ri-f" id="riF">0</span>
          <span class="ri-l">إناث</span>
        </div>
      </div>
      <div class="hero-legend">
        <div class="hl-item"><div class="hl-dot m"></div><span class="hl-num m" id="hlM">0</span><span class="hl-lbl">ذكور</span></div>
        <div class="hl-item"><div class="hl-dot f"></div><span class="hl-num f" id="hlF">0</span><span class="hl-lbl">إناث</span></div>
      </div>
    </div>

    <!-- الصف الأول: أفراد + مجاملة + B2B + B2C -->
    <div class="row" id="row1"></div>

    <!-- الصف الثاني: المخيمات -->
    <div class="row" id="row2"></div>
  </div>
</div>

<script>
var D,C=2*Math.PI*40;
document.addEventListener('DOMContentLoaded',function(){
  tk();setInterval(tk,1000);
  ld();setInterval(ld,300000);
});

function tk(){
  var n=new Date();
  document.getElementById('clk').textContent=
    n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')+':'+n.getSeconds().toString().padStart(2,'0');
}

function ld(){
  google.script.run
    .withSuccessHandler(function(j){
      try{
        var r=JSON.parse(j);
        if(!r.success){document.querySelector('.ld-txt').textContent='خطأ: '+(r.error||'');return}
        D=r.data;render();
        document.getElementById('loadingOverlay').style.display='none';
        document.getElementById('mainContent').style.display='flex';
        document.getElementById('upd').textContent='آخر تحديث: '+new Date(D.timestamp).toLocaleTimeString('ar-SA');
      }catch(e){console.error(e)}
    })
    .withFailureHandler(function(e){
      document.querySelector('.ld-txt').textContent='خطأ في الاتصال';
    })
    .getPilgrimStats();
}

function fmt(n){return(n||0).toLocaleString('en-US')}

function an(el,t){
  if(typeof el==='string')el=document.getElementById(el);
  if(!el)return;
  var c=parseInt(el.textContent.replace(/,/g,''))||0;
  if(c===t){el.textContent=fmt(t);return}
  var s=performance.now();
  (function step(now){
    var p=Math.min((now-s)/1200,1),e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(c+(t-c)*e));
    if(p<1)requestAnimationFrame(step);
  })(s);
}

function render(){
  // Hero
  an('hTotal',D.total);an('riM',D.gender.male);an('riF',D.gender.female);
  an('hlM',D.gender.male);an('hlF',D.gender.female);
  var t=D.gender.male+D.gender.female,mp=t?D.gender.male/t:0.5;
  var mA=mp*C,fA=(1-mp)*C;
  document.getElementById('arcM').setAttribute('stroke-dasharray',mA+' '+C);
  document.getElementById('arcF').setAttribute('stroke-dasharray',fA+' '+C);
  document.getElementById('arcF').setAttribute('stroke-dashoffset','-'+mA);

  // الصف الأول
  var r1=[
    {n:'الأفراد',d:D.individualsMF,cls:'card-green'},
    {n:'المجاملة',d:D.courtesyMF,cls:'card-gold'},
    {n:'طيران B2B',d:D.b2bMF,cls:'card-navy'},
    {n:'طيران B2C',d:D.b2cMF,cls:'card-purple'}
  ];
  document.getElementById('row1').innerHTML=mkCards(r1,0);

  // الصف الثاني — المخيمات
  var camps=D.campsMF||[];
  var r2=[];
  for(var i=0;i<camps.length;i++){
    r2.push({n:camps[i].name,d:camps[i],cls:'card-green'});
  }
  document.getElementById('row2').innerHTML=mkCards(r2,r1.length);
}

function mkCards(arr,offset){
  var h='';
  for(var i=0;i<arr.length;i++){
    var c=arr[i],d=c.d||{total:0,male:0,female:0};
    var ct=d.total||0,cm=d.male||0,cf=d.female||0;
    var mp=ct?(cm/ct*100):50,fp=100-mp;
    var delay=(0.1+(offset+i)*0.08).toFixed(2);
    h+='<div class="card '+c.cls+'" style="animation:cFade 0.6s ease '+delay+'s forwards;opacity:0">'+
      '<div class="card-title">'+c.n+'</div>'+
      '<div class="card-num">'+fmt(ct)+'</div>'+
      '<div class="bar-wrap"><div class="bar-m" style="width:'+mp.toFixed(1)+'%"></div><div class="bar-f" style="width:'+fp.toFixed(1)+'%"></div></div>'+
      '<div class="card-mf">'+
        '<div class="mf-col"><div class="mf-num m">'+fmt(cm)+'</div><div class="mf-lbl">ذكور</div></div>'+
        '<div class="mf-col"><div class="mf-num f">'+fmt(cf)+'</div><div class="mf-lbl">إناث</div></div>'+
      '</div></div>';
  }
  return h;
}
</script>
<style>@keyframes cFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
</body>
</html>
