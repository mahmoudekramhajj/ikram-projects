<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
  <?!= include('Styles') ?>
</head>
<body>
  <div class="index-page">
    <div>
      <div class="index-title">إحصائيات الحجاج — إكرام الضيف</div>
      <div class="index-grid" id="linksGrid"></div>
    </div>
  </div>
  <script>
    var views = [
      { view: 'kpi', icon: '📊', title: 'نظرة عامة', desc: 'الأرقام الرئيسية + رسوم بيانية' },
      { view: 'summary', icon: '📋', title: 'ملخص العمليات', desc: 'الباقات — التأشيرات — المرشدين — الدول' },
      { view: 'countries', icon: '🌍', title: 'بلد الإقامة', desc: 'توزيع كل الحجاج حسب بلد الإقامة' },
      { view: 'nationalities', icon: '🏳️', title: 'الجنسيات', desc: 'توزيع كل الحجاج حسب الجنسية' },
      { view: 'b2c-courtesy', icon: '🔷', title: 'B2C والمجاملة', desc: 'توزيع حسب الدولة مع ذكور وإناث' },
      { view: 'camps', icon: '⛺', title: 'المخيمات + B2B/B2C', desc: 'المخيمات والجنس ونوع العقد' }
    ];
    var base = '<?= baseUrl ?>';
    var grid = document.getElementById('linksGrid');
    views.forEach(function(v) {
      var a = document.createElement('a');
      a.className = 'index-card';
      a.href = base + '?view=' + v.view;
      a.target = '_blank';
      a.innerHTML = '<div class="icon">' + v.icon + '</div><h3>' + v.title + '</h3><p>' + v.desc + '</p>';
      grid.appendChild(a);
    });
  </script>
</body>
</html>
