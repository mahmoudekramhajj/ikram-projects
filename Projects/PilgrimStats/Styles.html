<style>
:root {
  --bg: #0a0f1a;
  --bg-card: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --primary: #065f46;
  --primary-light: #10b981;
  --accent: #6ee7b7;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --orange: #f59e0b;
  --pink: #ec4899;
  --red: #ef4444;
  --cyan: #06b6d4;
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'Noto Kufi Arabic', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ============ شاشة التحميل ============ */
#loadingOverlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
}
.spinner {
  width: 50px; height: 50px;
  border: 4px solid var(--border);
  border-top-color: var(--primary-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 12px; color: var(--text-dim); font-size: 16px; }

/* ============ الشريط العلوي (مشترك) ============ */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--primary) 0%, #064e3b 100%);
  border-bottom: 2px solid var(--accent);
  height: 56px;
  flex-shrink: 0;
}
.top-bar h1 { font-size: 22px; font-weight: 800; color: #fff; }
.top-bar .subtitle { font-size: 12px; color: var(--accent); margin-right: 8px; }
.time-section { text-align: left; display: flex; align-items: center; gap: 16px; }
.clock { font-size: 24px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; direction: ltr; }
.last-update { font-size: 11px; color: var(--accent); }

/* ============ تخطيط الصفحة (ملء الشاشة) ============ */
.page-layout {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.page-content {
  flex: 1;
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

/* ============ بطاقات KPI ============ */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  flex-shrink: 0;
}
.kpi-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  border: 1px solid var(--border);
}
.kpi-value {
  font-size: 38px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.kpi-label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.kpi-total .kpi-value { color: var(--accent); }
.kpi-male .kpi-value { color: var(--blue); }
.kpi-female .kpi-value { color: var(--pink); }
.kpi-b2b .kpi-value { color: var(--purple); }
.kpi-b2c .kpi-value { color: var(--orange); }
.kpi-courtesy .kpi-value { color: var(--red); }

/* ============ الرسوم البيانية (KPI view) ============ */
.charts-area {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  min-height: 0;
}
.chart-panel {
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chart-panel-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}
.chart-panel-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  min-height: 0;
}
.chart-panel-body canvas { max-width: 100%; max-height: 100%; }

/* ============ جدول ملء الشاشة (متعدد الأعمدة) ============ */
.fullscreen-table-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.table-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  flex-shrink: 0;
}
.table-header-bar h2 { font-size: 18px; font-weight: 700; }
.badge {
  background: var(--primary);
  color: var(--accent);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.multi-col-table {
  flex: 1;
  display: grid;
  gap: 12px;
  min-height: 0;
}
.multi-col-table.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.multi-col-table.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

.col-block {
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats-table th {
  text-align: right;
  padding: 6px 10px;
  color: var(--text-dim);
  font-weight: 600;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
}
.stats-table td {
  padding: 5px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.stats-table tr:hover td { background: rgba(255,255,255,0.03); }

.count-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
.pct-cell { color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; }

.progress-cell { width: 25%; }
.progress-bar {
  height: 5px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--primary-light), var(--accent));
}

/* إبراز مخيم المجاملة */
.camp-courtesy td { color: var(--red); font-weight: 700; }
.camp-courtesy .progress-fill { background: linear-gradient(90deg, var(--red), var(--orange)); }

/* ============ Camps View — تخطيط ثلاثي ============ */
.camps-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  min-height: 0;
}
.camps-panel {
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.camps-panel-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}
.camps-panel-body {
  flex: 1;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.b2b-b2c-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  flex: 1;
}
.b2b-b2c-col h4 {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-align: center;
}

/* ============ صفحة الفهرس ============ */
.index-page {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
}
.index-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  max-width: 800px;
  width: 90%;
}
.index-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  transition: all 0.3s;
}
.index-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(16,185,129,0.2);
}
.index-card .icon { font-size: 48px; margin-bottom: 12px; }
.index-card h3 { font-size: 18px; margin-bottom: 6px; }
.index-card p { font-size: 13px; color: var(--text-dim); }
.index-title {
  text-align: center;
  margin-bottom: 32px;
  font-size: 28px;
  font-weight: 800;
  color: var(--accent);
}

/* ============ أنيميشن ============ */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.kpi-card, .chart-panel, .col-block, .camps-panel { animation: fadeIn 0.4s ease forwards; }
</style>
