<style>
/* ============================================================
   Transport Management — CSS
   إكرام الضيف للسياحة | حج 1447هـ — 2026م
   Mobile-first, RTL, Dark theme
   ============================================================ */

/* فرض الأرقام الغربية (0-9) بدل الهندية */
* { font-variant-numeric: lining-nums; }
input, select, button, table, th, td, .stat-value, .plan-op-count {
  font-feature-settings: "lnum";
}

:root {
  --primary: #0D4A3A;
  --primary-light: #1A6B54;
  --primary-dark: #093028;
  --accent: #C8A84E;
  --accent-light: #D4B968;
  --bg: #F5F2EB;
  --bg-card: #FFFFFF;
  --text: #1A1A1A;
  --text-light: #666666;
  --text-muted: #999999;
  --border: #E0DCD4;
  --success: #27AE60;
  --warning: #F39C12;
  --danger: #E74C3C;
  --info: #3498DB;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Tajawal', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   LOGIN SCREEN
   ============================================================ */

.login-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
}

.login-logo {
  width: 80px;
  height: 80px;
  margin-bottom: 16px;
}

.login-title {
  color: #FFF;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}

.login-subtitle {
  color: var(--accent);
  font-size: 14px;
  margin-bottom: 32px;
}

.login-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.login-card h3 {
  text-align: center;
  margin-bottom: 20px;
  color: var(--primary);
}

/* City Selector */
.city-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.city-btn {
  flex: 1;
  padding: 12px 8px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.city-btn.active {
  border-color: var(--primary);
  background: var(--primary);
  color: #FFF;
}

/* Location Dropdown */
.location-select {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 16px;
  background: var(--bg);
  direction: rtl;
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #FFF;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}

.login-btn:hover { background: var(--primary-light); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================================
   HEADER
   ============================================================ */

.header {
  background: var(--primary);
  color: #FFF;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.header-title {
  font-size: 16px;
  font-weight: 700;
}

.header-location {
  font-size: 12px;
  color: var(--accent);
}

.header-user {
  font-size: 12px;
  opacity: 0.8;
}

/* ============================================================
   TAB NAVIGATION
   ============================================================ */

.tab-nav {
  display: flex;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 52px;
  z-index: 90;
}

.tab-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 0 0 auto;
  padding: 10px 16px;
  border: none;
  background: none;
  color: var(--text-light);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
}

.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.tab-content {
  display: none;
  padding: 16px;
}

.tab-content.active { display: block; }

/* ============================================================
   STATS BAR
   ============================================================ */

.stats-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}

.stat-card {
  flex: 1;
  min-width: 80px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
  box-shadow: var(--shadow);
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ============================================================
   TRIP CARDS
   ============================================================ */

.trip-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border-right: 4px solid var(--primary);
  cursor: pointer;
  transition: transform 0.15s;
}

.trip-card:active { transform: scale(0.98); }

.trip-card.status-boarding { border-right-color: var(--warning); }
.trip-card.status-departed { border-right-color: var(--info); }
.trip-card.status-arrived { border-right-color: var(--success); }
.trip-card.status-cancelled { border-right-color: var(--danger); opacity: 0.6; }

.trip-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.trip-operation {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.trip-time {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}

.trip-route {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 8px;
}

.trip-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-muted);
}

.trip-meta span { display: flex; align-items: center; gap: 4px; }

.trip-progress {
  margin-top: 8px;
  background: var(--border);
  border-radius: 4px;
  height: 6px;
  overflow: hidden;
}

.trip-progress-bar {
  height: 100%;
  background: var(--success);
  border-radius: 4px;
  transition: width 0.3s;
}

/* Status Badge */
.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.status-badge.scheduled { background: #EBF5FB; color: var(--info); }
.status-badge.boarding { background: #FEF9E7; color: var(--warning); }
.status-badge.departed { background: #E8F8F5; color: var(--primary); }
.status-badge.arrived { background: #E9F7EF; color: var(--success); }
.status-badge.cancelled { background: #FDEDEC; color: var(--danger); }

/* Severity Badge */
.severity-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.severity-badge.low { background: #E8F8F5; color: var(--primary); }
.severity-badge.medium { background: #FEF9E7; color: var(--warning); }
.severity-badge.high { background: #FDEDEC; color: var(--danger); }
.severity-badge.critical { background: var(--danger); color: #FFF; }

/* ============================================================
   SCANNER
   ============================================================ */

.scanner-container {
  text-align: center;
}

#qr-reader {
  width: 100%;
  max-width: 400px;
  margin: 0 auto 16px;
  border-radius: var(--radius);
  overflow: hidden;
}

.scan-result {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 16px 0;
  box-shadow: var(--shadow);
  text-align: center;
}

.scan-result.success { border: 2px solid var(--success); }
.scan-result.error { border: 2px solid var(--danger); }
.scan-result.warning { border: 2px solid var(--warning); }

.scan-pilgrim-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}

.scan-pilgrim-info {
  font-size: 13px;
  color: var(--text-light);
}

.manual-input {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.manual-input input {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  direction: ltr;
  text-align: center;
}

/* ============================================================
   DASHBOARD GRID (28 Operations)
   ============================================================ */

.ops-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
  margin-top: 16px;
}

.ops-card {
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  box-shadow: var(--shadow);
  border-top: 3px solid var(--border);
}

.ops-card.green { border-top-color: var(--success); }
.ops-card.yellow { border-top-color: var(--warning); }
.ops-card.red { border-top-color: var(--danger); }
.ops-card.gray { border-top-color: var(--border); }

.ops-card-name {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 4px;
  line-height: 1.3;
}

.ops-card-count {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}

.ops-card-label {
  font-size: 10px;
  color: var(--text-muted);
}

/* ============================================================
   BUTTONS
   ============================================================ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn-primary { background: var(--primary); color: #FFF; }
.btn-primary:hover { background: var(--primary-light); }
.btn-success { background: var(--success); color: #FFF; }
.btn-warning { background: var(--warning); color: #FFF; }
.btn-danger { background: var(--danger); color: #FFF; }
.btn-outline {
  background: transparent;
  color: var(--primary);
  border: 2px solid var(--primary);
}

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-block { width: 100%; }

/* ============================================================
   FORMS
   ============================================================ */

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  background: var(--bg);
  transition: border-color 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
}

.form-textarea { min-height: 80px; resize: vertical; }

/* ============================================================
   MODAL
   ============================================================ */

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
}

.modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: var(--bg);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   PILGRIM LIST (inside trip detail)
   ============================================================ */

.pilgrim-list {
  list-style: none;
}

.pilgrim-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.pilgrim-item:last-child { border-bottom: none; }

.pilgrim-name {
  font-weight: 600;
  font-size: 14px;
}

.pilgrim-passport {
  font-size: 12px;
  color: var(--text-muted);
  direction: ltr;
}

/* ============================================================
   LOADING & TOAST
   ============================================================ */

.loading-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  z-index: 300;
  align-items: center;
  justify-content: center;
}

.loading-overlay.active { display: flex; }

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.toast {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary);
  color: #FFF;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  z-index: 400;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  max-width: 90%;
  text-align: center;
}

.toast.error { background: var(--danger); }
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); }

/* ============================================================
   EMPTY STATE
   ============================================================ */

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-state-text {
  font-size: 16px;
  font-weight: 600;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (min-width: 768px) {
  .ops-grid { grid-template-columns: repeat(4, 1fr); }
  .stats-bar { flex-wrap: nowrap; }
  .modal { border-radius: var(--radius); max-height: 80vh; }
  .modal-overlay { align-items: center; }
}

@media (min-width: 1024px) {
  .ops-grid { grid-template-columns: repeat(7, 1fr); }
}

/* ============================================================
   PLAN VIEW — خطة النقل
   ============================================================ */

.plan-date-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 100px;
  z-index: 5;
}

.plan-date-input {
  flex: 1;
  max-width: 180px;
  text-align: center;
  font-weight: 700;
  font-size: 15px;
}

.plan-filter {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.plan-filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: #fff;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.plan-filter-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.plan-op-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  margin: 8px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  border-right: 4px solid var(--primary);
}

.plan-op-card:active {
  transform: scale(0.98);
}

.plan-op-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.plan-op-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 6px;
}

.plan-op-name {
  font-weight: 700;
  font-size: 14px;
  color: #333;
}

.plan-op-count {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1;
}

.plan-op-count small {
  font-size: 12px;
  font-weight: 400;
  color: #888;
}

.plan-op-groups {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.plan-op-group-chip {
  display: inline-block;
  padding: 2px 8px;
  background: #f0f0f0;
  border-radius: 10px;
  font-size: 11px;
  color: #555;
}

.plan-op-group-chip.hotel {
  background: #e8f5e9;
  color: #2e7d32;
}

/* ============================================================
   PILGRIM TABLE — جدول الحجاج
   ============================================================ */

.pilgrim-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.pilgrim-table th {
  background: var(--primary);
  color: #fff;
  padding: 8px 6px;
  font-weight: 500;
  text-align: right;
  white-space: nowrap;
  position: sticky;
  top: 0;
}

.pilgrim-table td {
  padding: 6px;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
}

.pilgrim-table tr:nth-child(even) {
  background: #f9f9f9;
}

.pilgrim-table tr:hover {
  background: #e8f5e9;
}

/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
</style>
