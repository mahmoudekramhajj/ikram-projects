<script>
// Trip selector for QR scanning
function selectTripForScan(tripId) {
  if (!tripId) {
    state.selectedTrip = null;
    return;
  }
  state.selectedTrip = state.trips.find(function(t) { return t.tripId === tripId; }) || null;
}

// Populate scan trip dropdown when switching to scanner tab
var origSwitchTab = switchTab;
switchTab = function(tabName) {
  origSwitchTab(tabName);
  if (tabName === 'scanner') {
    var select = document.getElementById('scanTripSelect');
    select.innerHTML = '<option value="">-- اختر رحلة --</option>';
    for (var i = 0; i < state.trips.length; i++) {
      var t = state.trips[i];
      if (t.status === 'cancelled' || t.status === 'arrived') continue;
      var opt = document.createElement('option');
      opt.value = t.tripId;
      opt.textContent = t.scheduledTime + ' | ' + t.operationName;
      select.appendChild(opt);
    }
  }
};

// QR Scanner placeholder — full implementation in Phase 3
function toggleQrScanner() {
  showToast('سيتم تفعيل كاميرا QR في المرحلة 3 — استخدم الإدخال اليدوي حالياً', 'warning');
}
</script>
