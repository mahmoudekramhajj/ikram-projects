<script>
/**
 * Hotel Management App — Rooming Scripts
 * v4.0 — SmartAssign Integration
 */

// ============================================================
// RENDER: ROOMING TAB
// ============================================================

function renderRoomingTab() {
  var activePilgrims = state.pilgrims.filter(function(p) { return p.arrivalStatus !== 'noshow'; });
  var assigned = activePilgrims.filter(function(p) { return p.roomGroupId; });
  var unassigned = activePilgrims.filter(function(p) { return !p.roomGroupId; });
  var guideUnassigned = unassigned.filter(function(p) { return p.tourGuide && p.tourGuide.trim() !== ''; });
  var autoUnassigned = unassigned.filter(function(p) { return !p.tourGuide || p.tourGuide.trim() === ''; });

  // Count rooms
  var rooms = {};
  assigned.forEach(function(p) { if (p.roomGroupId) rooms[p.roomGroupId] = true; });
  var totalRooms = Object.keys(rooms).length;

  // Partial rooms
  var roomGroups = {};
  assigned.forEach(function(p) {
    if (!roomGroups[p.roomGroupId]) roomGroups[p.roomGroupId] = { members: [], capacity: p.capacity || 4 };
    roomGroups[p.roomGroupId].members.push(p);
  });
  var partialCount = 0;
  Object.keys(roomGroups).forEach(function(gid) {
    if (roomGroups[gid].members.length < roomGroups[gid].capacity) partialCount++;
  });

  document.getElementById('roomingStats').innerHTML =
    statCard('إجمالي الحجاج', activePilgrims.length, '#94a3b8', '#334155') +
    statCard('تم تسكينهم', assigned.length, '#6ee7b7', '#064e3b') +
    statCard('غرف', totalRooms, '#38bdf8', '#0c4a6e') +
    statCard('غرف جزئية', partialCount, '#fbbf24', '#78350f') +
    statCard('بانتظار المرشد', guideUnassigned.length, '#c084fc', '#4c1d95') +
    statCard('بدون تسكين', autoUnassigned.length, '#f87171', '#7f1d1d');

  renderConfirmedGroups(assigned);
  renderUngroupedPilgrims(unassigned);
  populateGuideFilter();
}

// ============================================================
// SMART ASSIGN — التوزيع الذكي
// ============================================================

function runSmartAssign() {
  if (!state.currentHotel) { showToast('اختر فندقاً أولاً', true); return; }

  if (!confirm('سيتم مسح التسكين الحالي وإعادة التوزيع من الصفر.\n\nمتابعة؟')) return;

  showLoading(true);
  var city = getHotelCity();

  google.script.run
    .withSuccessHandler(function(result) {
      showLoading(false);
      if (result.success) {
        renderAssignmentReport(result);
        showToast('✅ تم توزيع ' + result.totalWritten + ' حاج في ' + result.familiesAssigned + ' غرفة');
        loadPilgrims();
      } else {
        showToast('خطأ: ' + (result.error || 'غير معروف'), true);
      }
    })
    .withFailureHandler(function(err) {
      showLoading(false);
      showToast('خطأ: ' + err.message, true);
    })
    .smartAssignHotel(state.currentHotel, city);
}

// ============================================================
// UPDATE ASSIGN — اكتمل العدد
// ============================================================

function runUpdateAssign() {
  if (!state.currentHotel) { showToast('اختر فندقاً أولاً', true); return; }

  if (!confirm('سيتم معالجة التغييرات (حجاج جدد / ملغيين / منقولين) مع الحفاظ على التسكين الحالي.\n\nمتابعة؟')) return;

  showLoading(true);
  var city = getHotelCity();

  google.script.run
    .withSuccessHandler(function(result) {
      showLoading(false);
      if (result.success) {
        renderUpdateReport(result);
        loadPilgrims();
      } else {
        showToast('خطأ: ' + (result.error || 'غير معروف'), true);
      }
    })
    .withFailureHandler(function(err) {
      showLoading(false);
      showToast('خطأ: ' + err.message, true);
    })
    .updateAssignment(state.currentHotel, city);
}

// ============================================================
// CLEAR — مسح التسكين
// ============================================================

function clearAllAssignments() {
  if (!state.currentHotel) { showToast('اختر فندقاً أولاً', true); return; }
  if (!confirm('سيتم مسح جميع بيانات التسكين لهذا الفندق.\n\nهل أنت متأكد؟')) return;

  showLoading(true);

  google.script.run
    .withSuccessHandler(function(result) {
      showLoading(false);
      if (result.success) {
        showToast('✅ تم مسح تسكين ' + result.cleared + ' حاج');
        loadPilgrims();
      } else {
        showToast('خطأ: ' + (result.error || 'غير معروف'), true);
      }
    })
    .withFailureHandler(function(err) {
      showLoading(false);
      showToast('خطأ: ' + err.message, true);
    })
    .clearHotelAssignments(state.currentHotel);
}

// ============================================================
// GUIDE STATS — إحصائية المرشدين
// ============================================================

function showGuideStats() {
  if (!state.currentHotel) { showToast('اختر فندقاً أولاً', true); return; }
  showLoading(true);

  google.script.run
    .withSuccessHandler(function(result) {
      showLoading(false);
      renderGuideStatsPanel(result);
    })
    .withFailureHandler(function(err) {
      showLoading(false);
      showToast('خطأ: ' + err.message, true);
    })
    .getGuideStats(state.currentHotel);
}

function renderGuideStatsPanel(stats) {
  var panel = document.getElementById('guideStatsPanel');
  if (!stats || !stats.guides || stats.guides.length === 0) {
    panel.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8">لا يوجد مرشدين لهذا الفندق</div>';
    panel.style.display = '';
    return;
  }

  var html = '<div style="background:#1e1b4b;border:1px solid #6366f1;border-radius:12px;padding:16px;margin-bottom:16px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html += '<span style="font-weight:700;color:#c084fc;font-size:15px">📊 إحصائية المرشدين — ' + stats.hotel + '</span>';
  html += '<button onclick="document.getElementById(\'guideStatsPanel\').style.display=\'none\'" style="background:#4c1d95;color:#c084fc;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer">✕ إغلاق</button>';
  html += '</div>';

  // Hotel vacancy
  html += '<div style="background:#0f172a;border-radius:8px;padding:10px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap">';
  html += '<span style="color:#38bdf8;font-size:12px">الغرف الكلية: <b>' + (stats.totalRooms || 0) + '</b></span>';
  html += '<span style="color:#6ee7b7;font-size:12px">مشغولة: <b>' + (stats.occupiedRooms || 0) + '</b></span>';
  html += '<span style="color:#fbbf24;font-size:12px">فارغة: <b>' + (stats.availableRooms || 0) + '</b></span>';
  html += '</div>';

  // Each guide
  stats.guides.forEach(function(g) {
    html += '<div style="background:#0f172a;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid #334155">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">';
    html += '<span style="font-weight:700;color:#e2e8f0;font-size:13px">🎯 ' + g.name + '</span>';
    html += '<span style="color:#94a3b8;font-size:11px">' + g.totalPilgrims + ' حاج | ' +
      g.assigned + ' مسكّن | ' + g.unassigned + ' بانتظار</span>';
    html += '</div></div>';
  });

  html += '</div>';
  panel.innerHTML = html;
  panel.style.display = '';
}

// ============================================================
// REPORTS — التقارير
// ============================================================

function renderAssignmentReport(result) {
  var panel = document.getElementById('assignmentReport');
  var html = '<div style="background:#064e3b;border:1px solid #6ee7b7;border-radius:12px;padding:16px;margin-bottom:16px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html += '<span style="font-weight:700;color:#6ee7b7;font-size:15px">✅ تقرير التوزيع الذكي</span>';
  html += '<button onclick="document.getElementById(\'assignmentReport\').style.display=\'none\'" style="background:#065f46;color:#6ee7b7;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer">✕ إغلاق</button>';
  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px">';
  html += reportStat('إجمالي الحجاج', result.totalPilgrims, '#e2e8f0');
  html += reportStat('تم تسكينهم', result.totalWritten, '#6ee7b7');
  html += reportStat('عائلات', result.familiesAssigned, '#38bdf8');
  html += reportStat('مشاركين', result.sharedRoomsAssigned, '#fbbf24');
  html += reportStat('غرف جزئية', result.partialRooms, '#f87171');
  html += reportStat('بانتظار المرشد', result.guideSharersExcluded, '#c084fc');
  html += '</div>';

  // Partial room details
  if (result.partialDetails && result.partialDetails.length > 0) {
    html += '<div style="margin-top:8px">';
    html += '<div style="color:#fbbf24;font-size:12px;font-weight:700;margin-bottom:6px">⚠ غرف جزئية:</div>';
    result.partialDetails.forEach(function(r) {
      html += '<span style="background:#1e293b;padding:4px 10px;border-radius:8px;font-size:11px;color:#e2e8f0;margin-left:6px">' +
        r.roomId + ' (' + r.occupants + '/' + r.capacity + ' ' + (r.gender === 'Male' ? '👨' : '👩') + ')</span>';
    });
    html += '</div>';
  }

  html += '</div>';
  panel.innerHTML = html;
  panel.style.display = '';
}

function renderUpdateReport(result) {
  var panel = document.getElementById('assignmentReport');
  var html = '<div style="background:#1e3a5f;border:1px solid #38bdf8;border-radius:12px;padding:16px;margin-bottom:16px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html += '<span style="font-weight:700;color:#38bdf8;font-size:15px">🔄 تقرير التحديث</span>';
  html += '<button onclick="document.getElementById(\'assignmentReport\').style.display=\'none\'" style="background:#0c4a6e;color:#38bdf8;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer">✕ إغلاق</button>';
  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">';
  html += reportStat('جدد تم تسكينهم', result.newAssigned || 0, '#6ee7b7');
  html += reportStat('تم إخراجهم', result.removed || 0, '#f87171');
  html += reportStat('تم نقلهم', result.moved || 0, '#fbbf24');
  html += reportStat('غرف محسّنة', result.optimized || 0, '#38bdf8');
  html += '</div>';

  html += '</div>';
  panel.innerHTML = html;
  panel.style.display = '';
  showToast('🔄 تحديث: +' + (result.newAssigned || 0) + ' جديد، -' + (result.removed || 0) + ' ملغي، ↔' + (result.moved || 0) + ' نُقل');
}

function reportStat(label, value, color) {
  return '<div style="background:#0f172a;border-radius:8px;padding:10px;text-align:center">' +
    '<div style="font-size:20px;font-weight:800;color:' + color + '">' + value + '</div>' +
    '<div style="font-size:11px;color:#94a3b8;margin-top:2px">' + label + '</div></div>';
}

// ============================================================
// RENDER: CONFIRMED GROUPS
// ============================================================

function renderConfirmedGroups(grouped) {
  var container = document.getElementById('confirmedGroups');
  if (grouped.length === 0) { container.innerHTML = ''; return; }

  var groups = {};
  grouped.forEach(function(p) {
    if (!groups[p.roomGroupId]) groups[p.roomGroupId] = [];
    groups[p.roomGroupId].push(p);
  });

  var html = '<div class="section-title" style="color:#6ee7b7">✅ غرف تم تسكينها (' + Object.keys(groups).length + ' غرفة)</div>';

  Object.keys(groups).sort().forEach(function(gid) {
    var members = groups[gid];
    var capacity = members[0].capacity || 4;
    var isIncomplete = members.length < capacity;
    var hasOverflow = members.length > capacity;
    var borderColor = hasOverflow ? 'rgba(239,68,68,0.5)' : isIncomplete ? 'rgba(251,191,36,0.3)' : 'rgba(110,231,183,0.2)';

    // Check mixed gender across different groups
    var genders = {};
    var groupNums = {};
    members.forEach(function(p) { genders[p.gender] = true; groupNums[p.groupNumber] = true; });
    var isMixedGender = Object.keys(genders).length > 1;
    var isMultiGroup = Object.keys(groupNums).length > 1;
    var hasGenderIssue = isMixedGender && isMultiGroup;

    html += '<div class="room-group" style="border-color:' + borderColor + '">';
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">';

    var statusColor = hasOverflow ? '#ef4444' : isIncomplete ? '#fbbf24' : '#6ee7b7';
    var typeLabel = members[0].roomType || (capacity === 4 ? 'رباعية' : capacity === 3 ? 'ثلاثية' : 'مزدوجة');

    html += '<span style="font-weight:700;color:' + statusColor + '">' +
      '<span style="font-family:monospace;background:#1e293b;padding:2px 8px;border-radius:4px;color:#38bdf8;font-size:13px;font-weight:700">' + gid + '</span> ' +
      typeLabel + ' — ' + members.length + '/' + capacity + '</span>';
    html += '<div style="display:flex;gap:6px">';
    if (hasOverflow) html += '<span style="color:#ef4444;font-size:11px;font-weight:700">🚨 تجاوز!</span>';
    if (isIncomplete) html += '<span style="color:#fbbf24;font-size:11px;font-weight:700">⚠ جزئية</span>';
    if (hasGenderIssue) html += '<span style="color:#ef4444;font-size:11px;font-weight:700">⚠ خلط جنس!</span>';
    html += '</div></div>';

    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    members.forEach(function(p) {
      html += '<span style="background:#0f172a;padding:4px 10px;border-radius:8px;font-size:11px;color:#e2e8f0">' +
        (p.gender === 'Male' ? '👨' : '👩') + ' ' + p.name + ' (' + p.nationality + ') #' + p.groupNumber +
      '</span>';
    });
    html += '</div></div>';
  });

  container.innerHTML = html;
}

// ============================================================
// RENDER: UNGROUPED (GUIDE MANUAL)
// ============================================================

function renderUngroupedPilgrims(ungrouped) {
  var container = document.getElementById('ungroupedPilgrims');
  if (ungrouped.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#6ee7b7">✅ كل الحجاج تم تسكينهم</div>';
    return;
  }

  var html = '<div class="section-title" style="color:#c084fc">🎯 حجاج بانتظار المرشد (' + ungrouped.length + ')</div>';

  ['Male', 'Female'].forEach(function(gender) {
    var gPilgrims = ungrouped.filter(function(p) { return p.gender === gender; });
    if (gPilgrims.length === 0) return;

    html += '<div class="gender-section-title ' + (gender === 'Male' ? 'gender-male' : 'gender-female') + '">';
    html += (gender === 'Male' ? '👨 رجال' : '👩 نساء') + ' (' + gPilgrims.length + ')';
    html += '</div>';

    gPilgrims.forEach(function(p) {
      var isSelected = state.selectedForRooming.indexOf(p.bookingId) >= 0;
      html += '<div class="shared-pilgrim' + (isSelected ? ' selected' : '') + '" onclick="toggleRoomingSelection(\'' + p.bookingId + '\')">';
      html += '<div>';
      html += '<span style="font-weight:600;color:#e2e8f0;font-size:13px">' + p.name + '</span>';
      html += '<span style="color:#64748b;font-size:11px;margin-right:8px">مجموعة #' + p.groupNumber + '</span>';
      html += '</div>';
      html += '<div style="display:flex;gap:6px;align-items:center">';
      html += '<span style="font-size:11px;color:#94a3b8">🌍 ' + p.nationality + '</span>';
      html += '<span style="font-size:11px;color:#94a3b8">🛏️ ' + (p.roomType || '-') + '</span>';
      html += '<span style="font-size:11px;color:#c084fc">' + (p.tourGuide ? '🎯 ' + p.tourGuide : '') + '</span>';
      html += '<div class="checkbox-icon">' + (isSelected ? '✓' : '') + '</div>';
      html += '</div></div>';
    });
  });

  container.innerHTML = html;
  updateGroupingBar();
}

// ============================================================
// MANUAL GROUPING (for guide pilgrims)
// ============================================================

function toggleRoomingSelection(bookingId) {
  var idx = state.selectedForRooming.indexOf(bookingId);
  if (idx >= 0) { state.selectedForRooming.splice(idx, 1); }
  else { state.selectedForRooming.push(bookingId); }

  var unassigned = state.pilgrims.filter(function(p) { return !p.roomGroupId && p.arrivalStatus !== 'noshow'; });
  renderUngroupedPilgrims(unassigned);
}

function updateGroupingBar() {
  var bar = document.getElementById('groupingBar');
  var count = state.selectedForRooming.length;
  if (count > 0) {
    bar.style.display = '';
    document.getElementById('groupingCount').textContent = 'تم اختيار ' + count + ' حجاج — جاهزون للتسكين';
  } else {
    bar.style.display = 'none';
  }
}

function confirmRoomGroup() {
  if (state.selectedForRooming.length === 0) return;
  showLoading(true);
  var cityCode = getHotelCityCode();

  google.script.run
    .withSuccessHandler(function(result) {
      showToast('✅ تم تسكين ' + result.count + ' حاج في غرفة — ' + result.groupId);
      state.selectedForRooming = [];
      loadPilgrims();
    })
    .withFailureHandler(function(err) {
      showToast('خطأ: ' + err.message, true);
      showLoading(false);
    })
    .saveRoomGroup(state.selectedForRooming, state.currentHotel, cityCode, null);
}

// ============================================================
// GUIDE FILTER
// ============================================================

function populateGuideFilter() {
  var guides = {};
  state.pilgrims.forEach(function(p) {
    if (p.tourGuide && p.tourGuide.trim()) guides[p.tourGuide.trim()] = true;
  });

  var select = document.getElementById('guideFilter');
  var current = select.value;
  select.innerHTML = '<option value="">🎯 كل المرشدين</option>';

  Object.keys(guides).sort().forEach(function(g) {
    var opt = document.createElement('option');
    opt.value = g;
    opt.textContent = '🎯 ' + g;
    select.appendChild(opt);
  });

  select.value = current || '';
}

function applyGuideFilter() {
  var guide = document.getElementById('guideFilter').value;
  var activePilgrims = state.pilgrims.filter(function(p) { return p.arrivalStatus !== 'noshow'; });

  if (guide) {
    activePilgrims = activePilgrims.filter(function(p) { return p.tourGuide && p.tourGuide.trim() === guide; });
  }

  var assigned = activePilgrims.filter(function(p) { return p.roomGroupId; });
  var unassigned = activePilgrims.filter(function(p) { return !p.roomGroupId; });

  renderConfirmedGroups(assigned);
  renderUngroupedPilgrims(unassigned);
}

// ============================================================
// HELPER
// ============================================================

function getHotelCity() {
  var cityBtn = document.querySelector('.city-btn.active');
  if (!cityBtn) return 'Makkah';
  var city = cityBtn.getAttribute('data-city');
  return city === 'madinah' ? 'Madina' : 'Makkah';
}

// ============================================================
// EXPORT EXCEL
// ============================================================

function exportRoomAssignments() {
  if (!state.currentHotel) { showToast('اختر فندقاً أولاً', true); return; }
  showLoading(true);
  var cityCode = getHotelCityCode();

  google.script.run
    .withSuccessHandler(function(result) {
      showLoading(false);
      if (result.success) {
        // تنزيل مباشر من base64
        var link = document.createElement('a');
        link.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + result.base64;
        link.download = result.fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('✅ تم تصدير تقرير التسكين');
      } else {
        showToast('خطأ في التصدير', true);
      }
    })
    .withFailureHandler(function(err) {
      showLoading(false);
      showToast('خطأ: ' + err.message, true);
    })
    .exportToExcel('rooming', state.currentHotel, cityCode, null);
}

// ============================================================
// PRINT
// ============================================================

function printRoomAssignments() {
  if (!state.currentHotel) { showToast('اختر فندقاً أولاً', true); return; }

  var activePilgrims = state.pilgrims.filter(function(p) { return p.arrivalStatus !== 'noshow'; });
  var assigned = activePilgrims.filter(function(p) { return p.roomGroupId; });
  var unassigned = activePilgrims.filter(function(p) { return !p.roomGroupId; });

  var rooms = {};
  assigned.forEach(function(p) {
    if (!rooms[p.roomGroupId]) rooms[p.roomGroupId] = { members: [], type: p.roomType, capacity: p.capacity || 4 };
    rooms[p.roomGroupId].members.push(p);
  });

  var now = new Date();
  var dateStr = now.toLocaleDateString('ar-SA') + ' ' + now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  var roomKeys = Object.keys(rooms).sort();
  var partialCount = 0;
  roomKeys.forEach(function(r) { if (rooms[r].members.length < rooms[r].capacity) partialCount++; });

  var html = '<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">';
  html += '<title>تقرير التسكين — ' + state.currentHotel + '</title>';
  html += '<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;800&display=swap" rel="stylesheet">';
  html += '<style>';
  html += '* { box-sizing: border-box; margin: 0; padding: 0; }';
  html += 'body { font-family: "Noto Kufi Arabic", Arial, sans-serif; padding: 20px; background: #fff; color: #1e293b; font-size: 14px; max-width: 800px; margin: 0 auto; }';
  html += '@page { size: A4; margin: 12mm; }';
  html += '@media print { .no-print { display: none !important; } body { padding: 0; max-width: 100%; } }';

  // Header
  html += '.header { text-align: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 3px solid #064e3b; }';
  html += '.header h1 { font-size: 22px; color: #064e3b; }';
  html += '.header .sub { font-size: 13px; color: #64748b; margin-top: 6px; }';

  // Stats bar
  html += '.stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }';
  html += '.stat { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 20px; text-align: center; }';
  html += '.stat b { font-size: 24px; color: #064e3b; display: block; }';
  html += '.stat span { font-size: 11px; color: #64748b; }';

  // Room cards — عمود واحد
  html += '.room { border: 2px solid #cbd5e1; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; break-inside: avoid; }';
  html += '.room.full { border-color: #6ee7b7; background: #f0fdf4; }';
  html += '.room.partial { border-color: #fbbf24; background: #fffbeb; }';
  html += '.room-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; }';
  html += '.room-id { font-family: monospace; font-weight: 800; font-size: 16px; color: #0f172a; }';
  html += '.room-info { font-size: 13px; color: #64748b; margin-right: 8px; }';
  html += '.room-status { font-size: 13px; font-weight: 700; }';
  html += '.status-full { color: #059669; }';
  html += '.status-partial { color: #d97706; }';
  html += '.pilgrim { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px dotted #f1f5f9; font-size: 14px; }';
  html += '.pilgrim:last-child { border-bottom: none; }';
  html += '.pilgrim .name { font-weight: 700; font-size: 14px; }';
  html += '.male { color: #1e40af; } .female { color: #be185d; }';
  html += '.pilgrim .meta { color: #64748b; font-size: 12px; }';

  // Unassigned table
  html += '.section-title { font-size: 16px; font-weight: 800; color: #064e3b; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #064e3b; }';
  html += 'table { width: 100%; border-collapse: collapse; font-size: 13px; }';
  html += 'th { background: #064e3b; color: #fff; padding: 8px 10px; text-align: right; font-size: 12px; }';
  html += 'td { padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }';
  html += 'tr:nth-child(even) { background: #f8fafc; }';
  html += '</style></head><body>';

  // Header
  html += '<div class="header">';
  html += '<h1>' + state.currentHotel + '</h1>';
  html += '<div class="sub">تقرير التسكين | إكرام الضيف للسياحة | ' + dateStr + '</div>';
  html += '</div>';

  // Stats
  html += '<div class="stats">';
  html += '<div class="stat"><b>' + activePilgrims.length + '</b><span>إجمالي</span></div>';
  html += '<div class="stat"><b>' + assigned.length + '</b><span>مسكّنين</span></div>';
  html += '<div class="stat"><b>' + roomKeys.length + '</b><span>غرف</span></div>';
  html += '<div class="stat"><b>' + partialCount + '</b><span>جزئية</span></div>';
  html += '<div class="stat"><b>' + unassigned.length + '</b><span>بانتظار</span></div>';
  html += '</div>';

  // Print button
  html += '<div class="no-print" style="text-align:center;margin-bottom:12px">';
  html += '<button onclick="window.print()" style="background:#064e3b;color:#fff;border:none;padding:8px 24px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700">🖨️ طباعة</button>';
  html += '</div>';

  // Room cards grid
  html += '<div class="section-title">الغرف المسكّنة (' + roomKeys.length + ')</div>';

  roomKeys.forEach(function(rid) {
    var r = rooms[rid];
    var isFull = r.members.length >= r.capacity;
    var typeLabel = r.type || (r.capacity === 4 ? 'رباعية' : r.capacity === 3 ? 'ثلاثية' : 'مزدوجة');

    html += '<div class="room ' + (isFull ? 'full' : 'partial') + '">';
    html += '<div class="room-head">';
    html += '<div><span class="room-id">' + rid + '</span> <span class="room-info">' + typeLabel + '</span></div>';
    html += '<div><span class="room-status ' + (isFull ? 'status-full' : 'status-partial') + '">' + r.members.length + '/' + r.capacity + (isFull ? ' ✓' : ' ⚠') + '</span></div>';
    html += '</div>';

    r.members.forEach(function(m) {
      var cls = m.gender === 'Male' ? 'male' : 'female';
      html += '<div class="pilgrim">';
      html += '<span class="name ' + cls + '">' + (m.gender === 'Male' ? '♂' : '♀') + ' ' + m.name + '</span>';
      html += '<span class="meta">' + m.nationality + ' #' + m.groupNumber + '</span>';
      html += '</div>';
    });

    html += '</div>';
  });

  // Unassigned
  if (unassigned.length > 0) {
    html += '<div class="section-title">بانتظار المرشد (' + unassigned.length + ')</div>';
    html += '<table><tr><th>#</th><th>الاسم</th><th>الجنس</th><th>الجنسية</th><th>المجموعة</th><th>المرشد</th></tr>';
    unassigned.forEach(function(p, idx) {
      var cls = p.gender === 'Male' ? 'male' : 'female';
      html += '<tr><td>' + (idx + 1) + '</td><td class="' + cls + '"><b>' + p.name + '</b></td><td>' + (p.gender === 'Male' ? 'ذكر' : 'أنثى') + '</td><td>' + (p.nationality || '') + '</td><td>' + (p.groupNumber || '') + '</td><td>' + (p.tourGuide || '') + '</td></tr>';
    });
    html += '</table>';
  }

  html += '</body></html>';

  var printWindow = window.open('', '_blank');
  printWindow.document.write(html);
  printWindow.document.close();
}
</script>
