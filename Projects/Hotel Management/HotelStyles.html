<style>
/* ============================================================
   HOTEL MANAGEMENT APP — STYLES
   الهوية البصرية: إكرام الضيف للسياحة
   ============================================================ */

/* Reset & Base */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  background: #f5f5f0;
  color: #333333;
  min-height: 100vh;
  direction: rtl;
}

/* ========== HEADER ========== */
#appHeader {
  background: linear-gradient(135deg, #232E64 0%, #3a4a7a 50%, #476831 100%);
  border-bottom: 1px solid rgba(179,199,157,0.3);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo { font-size: 22px; }

.title { font-size: 16px; font-weight: 700; color: #FFFFFF; }
.subtitle { font-size: 10px; color: #B3C79D; font-weight: 600; }

.header-left {
  display: flex;
  gap: 8px;
  align-items: center;
}

#roleSelector {
  background: rgba(255,255,255,0.15);
  color: #FFFFFF;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
}

#roleSelector option {
  background: #FFFFFF;
  color: #333333;
}

/* ========== HOTEL SELECTOR ========== */
#hotelSelector {
  background: #FFFFFF;
  padding: 12px 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 1px solid #e0e0d8;
  align-items: center;
}

.city-toggle {
  display: flex;
  gap: 4px;
  background: #f0f0ea;
  border-radius: 10px;
  padding: 3px;
}

.city-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  transition: all 0.2s;
  background: transparent;
  color: #666666;
  white-space: nowrap;
}

.city-btn.active[data-city="madinah"] { background: #476831; color: #fff; }
.city-btn.active[data-city="makkah"] { background: #232E64; color: #fff; }
.city-btn.active[data-city="makkahShifting"] { background: #9B6FB1; color: #fff; }

#hotelDropdown {
  flex: 1;
  min-width: 200px;
  background: #FFFFFF;
  color: #333333;
  border: 1px solid #d0d0c8;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
}

/* ========== TAB NAVIGATION ========== */
#tabNav {
  display: flex;
  gap: 2px;
  padding: 8px 20px;
  background: #FFFFFF;
  border-bottom: 1px solid #e0e0d8;
  overflow-x: auto;
}

.tab-btn {
  padding: 8px 16px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  transition: all 0.2s;
  background: transparent;
  color: #888888;
  font-family: inherit;
}

.tab-btn.active {
  background: #476831;
  color: #FFFFFF;
}

.tab-btn:hover:not(.active) {
  background: #f0f0ea;
  color: #476831;
}

/* ========== TAB CONTENT ========== */
.tab-content {
  display: none;
  padding: 20px;
}

.tab-content.active { display: block; }

/* ========== STATS BAR ========== */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  border-radius: 12px;
  padding: 12px 16px;
  background: #FFFFFF;
  border: 1px solid #e0e0d8;
}

.stat-label {
  font-size: 10px;
  color: #888888;
  margin-bottom: 4px;
}

.stat-value {
  font-size: 22px;
  font-weight: 800;
  color: #333333;
}

/* ========== FILTER BAR ========== */
.filter-bar {
  background: #FFFFFF;
  border: 1px solid #e0e0d8;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-bar input,
.filter-bar select {
  background: #f9f9f5;
  color: #333333;
  border: 1px solid #d0d0c8;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  font-family: inherit;
}

.filter-bar input {
  flex: 1;
  min-width: 200px;
}

.filter-bar select {
  min-width: 120px;
}

/* ========== BUTTONS ========== */
.btn-primary {
  background: #476831;
  color: #FFFFFF;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn-primary:hover { background: #3a5728; }

.btn-checkin {
  background: #476831;
  color: #FFFFFF;
  border: none;
  border-radius: 8px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.btn-checkin:hover { background: #3a5728; }

.btn-confirm {
  background: #476831;
  color: #FFFFFF;
  border: none;
  border-radius: 10px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
}

.btn-export {
  background: #232E64;
  color: #FFFFFF;
  border: 1px solid #3a4a7a;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  white-space: nowrap;
}

.btn-export:hover { background: #1a2350; }

/* ========== PILGRIM CARD ========== */
.pilgrim-card {
  background: #FFFFFF;
  border-radius: 12px;
  padding: 14px;
  border: 1px solid #e0e0d8;
  margin-bottom: 8px;
  transition: all 0.2s;
}

.pilgrim-card.early-arrival {
  background: linear-gradient(135deg, #FFFFFF 80%, #fee2e2 100%);
}

.pilgrim-card.late-arrival {
  background: linear-gradient(135deg, #FFFFFF 80%, #fff7ed 100%);
  border-color: rgba(249, 115, 22, 0.3);
}

.pilgrim-card.delayed {
  border-color: rgba(248, 113, 113, 0.3);
}

.pilgrim-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 6px;
}

.pilgrim-name {
  font-weight: 700;
  font-size: 14px;
  color: #232E64;
}

.pilgrim-group {
  font-size: 11px;
  color: #888888;
  margin-right: 8px;
}

.pilgrim-details {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
  font-size: 11px;
  color: #666666;
}

.pilgrim-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.room-input {
  background: #f9f9f5;
  color: #333333;
  border: 1px solid #d0d0c8;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  width: 100px;
  font-family: inherit;
}

.room-assigned {
  margin-top: 8px;
  font-size: 12px;
  color: #476831;
  font-weight: 600;
}

/* ========== BADGES ========== */
.badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  display: inline-block;
}

.badge-arrived { background: #476831; color: #FFFFFF; }
.badge-pending { background: #B3C79D; color: #333333; }
.badge-delayed { background: #dc2626; color: #FFFFFF; }

.badge-early {
  background: #fee2e2;
  color: #dc2626;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
}

.badge-late {
  background: #fff7ed;
  color: #c2410c;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
}

.badge-dept-early { background: #fee2e2; color: #dc2626; }
.badge-dept-late { background: #fff7ed; color: #c2410c; }
.badge-dept-normal { background: #476831; color: #FFFFFF; }

/* ========== SECTION CARDS ========== */
.section-card {
  background: #FFFFFF;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 16px;
  border: 1px solid #e0e0d8;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  color: #476831;
  margin-bottom: 12px;
}

.mt-20 { margin-top: 20px; }

/* ========== ALERT CARD ========== */
.alert-card {
  background: linear-gradient(135deg, #fee2e2 0%, #FFFFFF 100%);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid rgba(248, 113, 113, 0.3);
  margin-bottom: 16px;
}

.alert-title {
  font-size: 13px;
  font-weight: 700;
  color: #dc2626;
  margin-bottom: 10px;
}

/* ========== FLIGHT CARD ========== */
.flight-card {
  background: #f9f9f5;
  border-radius: 10px;
  padding: 10px 14px;
  border: 1px solid #e0e0d8;
  min-width: 180px;
}

.flight-number {
  font-weight: 700;
  color: #232E64;
  font-size: 13px;
}

.flight-count {
  color: #476831;
  font-size: 11px;
  font-weight: 600;
}

.flight-expected {
  font-size: 12px;
  color: #9B6FB1;
  font-weight: 700;
  margin-top: 4px;
}

/* ========== SHARED PILGRIM (ROOMING) ========== */
.shared-pilgrim {
  background: #FFFFFF;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  border: 1px solid #e0e0d8;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.15s;
  margin-bottom: 6px;
}

.shared-pilgrim.selected {
  background: #eef2ff;
  border: 2px solid #232E64;
}

.checkbox-icon {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #d0d0c8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #fff;
  flex-shrink: 0;
}

.shared-pilgrim.selected .checkbox-icon {
  background: #232E64;
}

.gender-section-title {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 8px;
  display: inline-block;
  margin-bottom: 8px;
  margin-top: 12px;
}

.gender-male { background: #eef2ff; color: #232E64; }
.gender-female { background: #f5f0fa; color: #9B6FB1; }

/* ========== ROOM GROUP ========== */
.room-group {
  background: #f0f5eb;
  border-radius: 12px;
  padding: 14px;
  border: 1px solid rgba(71,104,49,0.2);
  margin-bottom: 8px;
}

/* ========== ACTION BAR ========== */
.action-bar {
  position: sticky;
  bottom: 12px;
  background: #476831;
  border-radius: 12px;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #B3C79D;
  z-index: 50;
}

.action-bar span {
  color: #FFFFFF;
  font-weight: 700;
  font-size: 13px;
}

/* ========== DEPARTURE CARD ========== */
.departure-card {
  background: #FFFFFF;
  border-radius: 12px;
  padding: 14px;
  border: 1px solid #e0e0d8;
  margin-bottom: 8px;
}

.departure-card.early {
  border-color: rgba(248, 113, 113, 0.3);
}

.departure-card.late {
  border-color: rgba(251, 191, 36, 0.3);
}

/* ========== UPCOMING DAY CARD ========== */
.day-card {
  background: #FFFFFF;
  border-radius: 12px;
  padding: 12px 14px;
  border: 1px solid #e0e0d8;
  text-align: center;
}

.day-date { font-size: 11px; color: #888888; }
.day-count { font-size: 24px; font-weight: 800; color: #9B6FB1; margin: 4px 0; }
.day-dest { font-size: 10px; color: #666666; }

/* ========== INVENTORY TABLE ========== */
.inventory-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 11px;
}

.inventory-table th {
  background: #232E64;
  color: #FFFFFF;
  padding: 10px 12px;
  text-align: center;
  position: sticky;
  top: 0;
}

.inventory-table th:first-child {
  text-align: right;
  border-radius: 10px 0 0 0;
}

.inventory-table th:last-child {
  border-radius: 0 10px 0 0;
}

.inventory-table td {
  padding: 10px 12px;
  text-align: center;
}

.inventory-table tr:nth-child(even) td { background: #f9f9f5; }
.inventory-table tr:nth-child(odd) td { background: #FFFFFF; }

.inventory-table td:first-child {
  font-weight: 700;
  color: #333333;
  text-align: right;
}

.pct-bar {
  background: #e0e0d8;
  border-radius: 20px;
  overflow: hidden;
  height: 18px;
  position: relative;
}

.pct-fill {
  height: 100%;
  border-radius: 20px;
  transition: width 0.5s;
}

.pct-text {
  position: absolute;
  top: 1px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 700;
  color: #333333;
}

/* ========== DASHBOARD TABLE ========== */
.dashboard-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 11px;
  overflow-x: auto;
}

.dashboard-table th {
  background: #232E64;
  color: #FFFFFF;
  padding: 10px 12px;
}

.dashboard-table td {
  padding: 10px 12px;
  text-align: center;
}

.dashboard-table tr:nth-child(even) td { background: #f9f9f5; }
.dashboard-table tr:nth-child(odd) td { background: #FFFFFF; }

.dashboard-table td:first-child {
  font-weight: 600;
  color: #333333;
  text-align: right;
}

.pct-badge {
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}

.pct-good { background: #476831; color: #FFFFFF; }
.pct-warn { background: #f59e0b; color: #FFFFFF; }
.pct-bad { background: #dc2626; color: #FFFFFF; }

/* ========== LOADING ========== */
#loadingOverlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(245, 245, 240, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #e0e0d8;
  border-top: 3px solid #476831;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  margin-top: 12px;
  color: #476831;
  font-size: 13px;
  font-weight: 600;
}

/* ========== TOAST ========== */
.toast {
  position: fixed;
  bottom: -60px;
  left: 50%;
  transform: translateX(-50%);
  background: #476831;
  color: #FFFFFF;
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  z-index: 2000;
  transition: bottom 0.3s ease;
  border: 1px solid #B3C79D;
}

.toast.show { bottom: 30px; }
.toast.error { background: #dc2626; color: #FFFFFF; border-color: #ef4444; }

/* ========== FOOTER ========== */
footer {
  text-align: center;
  padding: 20px 20px 30px;
  font-size: 10px;
  color: #aaaaaa;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 600px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .pilgrim-details { grid-template-columns: 1fr; }
  .filter-bar { flex-direction: column; }
  .filter-bar input, .filter-bar select { min-width: 100%; }
  .city-toggle { flex-wrap: wrap; }
  #tabNav { gap: 0; }
  .tab-btn { padding: 8px 10px; font-size: 10px; }
}
</style>
